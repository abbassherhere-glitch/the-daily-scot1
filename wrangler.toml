name = "the-daily-scot"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare D1 Relational Database Binding
# Replace with your production D1 database UUID created in Cloudflare dashboard or via wrangler d1 create
[[d1_databases]]
binding = "DB"
database_name = "daily-scot-db"
database_id = "REPLACE_WITH_D1_ID"

# Public environment variables (non-secret only)
# Note: Never put secrets in [vars]. Use wrangler secret:
#   wrangler pages secret put TURNSTILE_SECRET
#   wrangler pages secret put RESEND_API_KEY
[vars]
ENVIRONMENT = "production"
