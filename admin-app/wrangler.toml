name = "daily-scot-admin"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Shared Cloudflare D1 Database Binding
# Replace with your production D1 database UUID created in Cloudflare dashboard or via wrangler d1 create
[[d1_databases]]
binding = "DB"
database_name = "daily-scot-db"
database_id = "53f397c9-efea-4a7e-b0ca-4b71f6965e76"

# Shared Cloudflare R2 Media Storage Bucket Binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "daily-scot-media"

# Production Access Variables (no local dev bypass)
# REQUIRED: the newsroom refuses ALL logins (HTTP 503) until both values below are set to your
# real Cloudflare Zero Trust team name and the Access application's AUD tag.
# Never put secrets in [vars]. Use:
#   npx wrangler pages secret put BOT_CLIENT_ID --project-name daily-scot-admin
#   npx wrangler pages secret put CF_ACCESS_SERVICE_CLIENT_SECRET --project-name daily-scot-admin
[vars]
ENVIRONMENT = "production"
CF_ACCESS_TEAM_DOMAIN = "little-glitter-42c7"
CF_ACCESS_AUD = "fbb5050a315a4affcab876d8efe6b0aa8c945a24d0be795711cf8ec06ec84ea1"
MEDIA_PUBLIC_URL = "https://pub-07c4607f377f40c898f392545faf8c94.r2.dev"
